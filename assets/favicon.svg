<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="mmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0d1527" stroke="#1e2e4f" stroke-width="2"/>
  <rect x="8" y="8" width="84" height="84" rx="18" fill="none" stroke="url(#mmGrad)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Interlocking M M Monogram -->
  <path d="M22 68 V32 L36 52 L50 32 V68" 
        fill="none" 
        stroke="url(#mmGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
        
  <path d="M50 68 V32 L64 52 L78 32 V68" 
        fill="none" 
        stroke="url(#mmGrad)" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  
  <circle cx="50" cy="52" r="3.5" fill="#38bdf8" />
</svg>

